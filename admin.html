<!doctype html>
<html lang="en">
<head>

<body>
  <div class="demo-banner" id="banner"></div>
  <header class="hdr">
    <div class="wrap hdr-in">
      <a class="brand" href="index.html"><span class="brand-mark">B</span><span class="brand-name">Bazaar</span><span class="tag new" style="margin-left:4px">Admin</span></a>
      <nav class="hdr-actions">
        <button class="btn sm" id="langBtn" type="button">DE</button>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle theme"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg></button>
        <a class="btn btn-primary sm" href="index.html" id="toShop"></a>

    </div>
  </header>

  <main class="wrap" style="padding-bottom:64px">
    <div style="padding-top:28px">
      <h1 class="page-title" id="title"></h1>
      <p class="muted" id="lede" style="max-width:720px;margin-top:4px"></p>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <section id="tab-orders"></section>
    <section id="tab-stock" hidden></section>
    <section id="tab-runs" hidden></section>
  </main>

  <div class="toast" id="toast" role="status"></div>
  <script src="assets/data.js"></script>
  <script src="assets/admin.js"></script>
